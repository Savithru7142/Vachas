# Render.com deployment blueprint
# Docs: https://render.com/docs/deploy-django

services:
  - type: web
    name: the-vachas
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: RUN_SEED
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vachas-db
          property: connectionString

databases:
  - name: vachas-db
    plan: free
    databaseName: vachas
    user: vachas
