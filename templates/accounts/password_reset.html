{% extends "base/public_base.html" %}
{% block title %}Reset Password — {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="v-section"><div class="v-container max-w-md mx-auto">
<h1 class="font-serif text-3xl mb-6">Reset Password</h1>
<form method="post" class="v-card space-y-6">{% csrf_token %}
{% for field in form %}<div><label class="v-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<p class="text-sm mt-1">{{ field.errors.0 }}</p>{% endif %}</div>{% endfor %}
<button type="submit" class="v-btn w-full">Send Reset Link</button>
</form>
<p class="mt-6 text-center text-sm"><a href="{% url 'accounts:login' %}" class="v-link">Back to login</a></p>
</div></section>
{% endblock %}
