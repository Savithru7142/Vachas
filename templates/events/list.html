{% extends "base/public_base.html" %}
{% block title %}Events — {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="v-section">
    <div class="v-container">
        <h1 class="font-serif text-5xl">Events</h1>
        <div class="mt-12 grid gap-8 sm:grid-cols-2 lg:grid-cols-3">
            {% for event in events %}
            {% include "components/event_card.html" %}
            {% empty %}
            <div class="v-empty col-span-full">No events scheduled.</div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
