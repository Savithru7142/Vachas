{% extends "dashboard/member/base.html" %}
{% block page_title %}{{ task.title }}{% endblock %}
{% block content %}
<div class="max-w-2xl">
    <p class="text-sm text-smoke mb-6">{{ task.description|linebreaks }}</p>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div><label class="v-label">Status</label>{{ form.status }}</div>
        <button type="submit" class="v-btn">Update Status</button>
    </form>
</div>
{% endblock %}
