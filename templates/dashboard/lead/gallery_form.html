{% extends "dashboard/lead/base.html" %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="mb-6">
    <a href="{% url 'lead:gallery' %}" class="v-link text-sm">&larr; Back to gallery</a>
    <h2 class="font-serif text-2xl mt-2">{{ title }}</h2>
</div>

<form method="post" enctype="multipart/form-data" class="max-w-2xl space-y-6">
    {% csrf_token %}
    {% for field in form %}
    <div class="space-y-2">
        <label class="v-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-red-600 text-sm">{{ field.errors }}</div>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="v-btn">{% if title == 'Edit Photo' %}Save Changes{% else %}Upload{% endif %}</button>
</form>
{% endblock %}
