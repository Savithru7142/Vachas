services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_HOST: db
      PORT: 8000
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-vachas}
      POSTGRES_USER: ${DB_USER:-vachas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vachas}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vachas} -d ${DB_NAME:-vachas}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: Nginx reverse proxy with HTTPS (use after you have a domain + SSL cert)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - web

volumes:
  postgres_data:
  media_data:
